<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171b1a" />
    <meta name="description" content="《白昼市侦探社》第一关《窗外有事》互动剧情演示" />
    <title>白昼市侦探社｜窗外有事</title>
    <link rel="stylesheet" href="./styles.css?v=story-9-fit2" />
    <link rel="stylesheet" href="./layout-v9.css?v=story-9-fit2" />
  </head>
  <body>
    <main class="phone-shell" aria-label="白昼市侦探社互动剧情">
      <section class="game" id="game" data-state="gate">
        <div id="scene-backdrop" class="scene-backdrop" aria-hidden="true"></div>
        <img id="scene-image" class="scene-image" alt="剧情场景" />
        <audio id="intro-bed" preload="auto" src="./assets/opening-bed.m4a?v=story-9-fit2"></audio>
        <div class="scene-shade" aria-hidden="true"></div>

        <header class="case-header">
          <div class="case-mark" aria-hidden="true">白</div>
          <div class="case-heading">
            <span id="eyebrow">白昼市侦探社 · 第一关</span>
            <strong id="case-title">窗外有事</strong>
          </div>
          <button id="skip-button" class="text-button" type="button">跳过开场</button>
          <div id="case-progress" class="case-progress" hidden></div>
          <button id="sound-toggle" class="sound-toggle" type="button" aria-label="关闭声音" aria-pressed="true" hidden>🔊</button>
        </header>

        <div id="scene-ui" class="scene-ui"></div>
        <section id="sound-gate" class="sound-gate" aria-labelledby="sound-gate-title">
          <div class="sound-gate-card">
            <span class="sound-gate-kicker">案件一 · 雨夜</span>
            <h1 id="sound-gate-title">怎么进入故事？</h1>
            <p>声音会帮助你听清雨夜里的动静，也可以只看字幕。</p>
            <div class="sound-gate-actions">
              <button id="sound-start" class="sound-start" type="button">带声音进入</button>
              <button id="silent-start" class="silent-start" type="button">静音观看</button>
            </div>
          </div>
        </section>
        <div id="live-region" class="sr-only" aria-live="polite"></div>
      </section>
    </main>

    <script src="./app.js?v=story-9-fit2"></script>
  </body>
</html>
